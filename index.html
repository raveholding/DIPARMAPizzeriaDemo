  --ink:#242220;--sbtx:#e9e4da;--sbmut:#a39a8d;
  --acc:#ff7f00;--acc2:#c45a00;--accTx:#1f0d00;--accS:rgba(255,127,0,.12);
  --cream:#fff6e2;
  --ok:#1e7a46;--warn:#9a6200;--bad:#c0392b;--info:#2563a8;--hot:#7b3fc4;
  --r:16px;--sh:0 10px 30px rgba(36,34,32,.16);--sb:248px;
  --fd:Georgia,"Times New Roman",serif;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh}
/* Sidebar */
.sb{background:var(--ink);color:var(--sbtx);border-right:0;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 16px}
.brand img{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,127,0,.35)}
.brand b{font:700 17px/1.1 var(--fd);display:block;color:#fff}
.brand small{display:block;color:var(--acc);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sbmut);padding:12px 11px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--sbtx);text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--acc);color:var(--accTx);font-weight:600}
.nav .ic{width:20px;height:20px;flex:none;display:grid;place-items:center}
.nav .ic svg{width:18px;height:18px}
.nav .badge{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .badge.hot{background:var(--acc);color:var(--accTx)}
.nav a.on .badge{background:var(--ink);color:#fff}
.sbfoot{margin-top:auto;padding:14px 8px 0;color:var(--sbmut);font-size:11.5px;line-height:1.45}
.sbfoot b{color:var(--sbtx)}
.sbfoot a{color:var(--sbtx)}
.sbfoot i{color:var(--acc)}
/* Topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(246,243,238,.94);backdrop-filter:blur(12px);z-index:40;flex-wrap:wrap}
.top .ttl{flex:1;min-width:150px}
.top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .club{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.datebox{text-align:right;color:var(--mut);font-size:12px;line-height:1.2;white-space:nowrap}
.datebox b{color:var(--tx);font:600 22px/1 var(--fd);letter-spacing:.04em;display:block;font-variant-numeric:tabular-nums}
.prof{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:3px;flex-wrap:wrap}
.prof button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.prof button.on{background:var(--acc);color:var(--accTx)}
.prof button svg{width:15px;height:15px}
.who{display:flex;align-items:center;gap:8px}
.who select{width:auto;padding:6px 9px;font-size:13px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn .dotn{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--panel)}
.content{padding:22px 24px 90px;max-width:1600px;width:100%;margin:0 auto;flex:1;min-width:0}
/* Layout */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card>h3,.h3{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font:700 26px/1.15 var(--fd);letter-spacing:.01em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .d{color:var(--mut);font-size:12.5px;margin-top:2px}
.kpi.acc .v{color:var(--acc2)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.mut{color:var(--mut)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}
.hr{height:1px;background:var(--line);margin:14px 0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h2{font:700 27px/1.15 var(--fd)}
.page-h p{color:var(--mut);margin-top:4px;max-width:70ch}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;line-height:1.6;font-weight:500}
.pill.ok{color:var(--ok);border-color:rgba(76,195,138,.45);background:rgba(76,195,138,.08)}
.pill.warn{color:var(--warn);border-color:rgba(242,193,78,.45);background:rgba(242,193,78,.08)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,94,.45);background:rgba(255,107,94,.08)}
.pill.info{color:var(--info);border-color:rgba(106,174,240,.45);background:rgba(106,174,240,.08)}
.pill.hot{color:var(--hot);border-color:rgba(197,140,255,.45);background:rgba(197,140,255,.08)}
.pill.acc{color:var(--acc2);border-color:rgba(255,127,0,.5);background:var(--accS)}
.pill.py{color:#fff;background:#ea004b;border-color:#ea004b;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* Buttons */
.btn{background:var(--acc);color:var(--accTx);border:0;border-radius:11px;padding:9px 15px;font-weight:600;transition:background .15s,opacity .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--acc2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px;min-height:32px}
.btn.xs{padding:3px 9px;font-size:12px;border-radius:8px;min-height:26px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,94,.45)}
.btn.okb{background:var(--ok);color:#03200f}
.btn.infob{background:var(--info);color:#04172b}
.btn.hotb{background:var(--hot);color:#1d0636}
.btn.warnb{background:var(--warn);color:#271d00}
.btn.big{padding:12px 18px;font-size:15px;min-height:48px}
.btn.block{width:100%}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label,.lbl{font-size:11.5px;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;font-weight:500}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13.5px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 12px;color:var(--mut);font-weight:500;min-height:36px}
.seg button.on{background:var(--accS);border-color:var(--acc);color:var(--acc2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px dashed var(--line2);background:transparent;border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--mut)}
.chip:hover{border-color:var(--acc);color:var(--acc2)}
.notice{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;border:1px solid}
.notice.warn{background:rgba(242,193,78,.08);border-color:rgba(242,193,78,.4);color:#7a4f00}
.notice.ok{background:rgba(76,195,138,.08);border-color:rgba(76,195,138,.4);color:#155d35}
.notice.info{background:rgba(106,174,240,.08);border-color:rgba(106,174,240,.4);color:#1d4f86}
.notice.bad{background:rgba(255,107,94,.08);border-color:rgba(255,107,94,.4);color:#9b2c20}
.notice.acc{background:var(--accS);border-color:rgba(255,127,0,.45);color:#8a3d00}
/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel2)}
tfoot td{font-weight:650;border-top:1px solid var(--line2);border-bottom:0}
.empty{color:var(--mut);padding:22px 12px;text-align:center;font-size:13.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tab{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:7px 15px;white-space:nowrap;color:var(--mut);font-weight:500}
.tab.on{background:var(--acc);color:var(--accTx);border-color:var(--acc);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
/* Flujo de comanda */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.flow button{position:relative;border:0;background:none;padding:14px 16px 14px 22px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;border-right:1px solid var(--line)}
.flow button:last-child{border-right:0}
.flow button:hover{background:var(--panel2)}
.flow .n{font:600 30px/1 var(--fd);font-variant-numeric:tabular-nums}
.flow .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;gap:6px;align-items:center}
.flow .s{font-size:12px;color:var(--mut)}
.flow .k{position:absolute;left:0;top:0;bottom:0;width:4px}
/* Estados */
.st-pend_mozo{--c:var(--info)}.st-pend_caja{--c:var(--hot)}.st-pend_cocina{--c:var(--warn)}.st-preparando{--c:var(--acc)}.st-listo,.st-en_camino{--c:var(--ok)}.st-entregado{--c:var(--mut2)}.st-cancelado{--c:var(--bad)}
.stp{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);white-space:nowrap}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.eta{font:600 15px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:4px 9px;border-radius:8px;background:var(--panel3);white-space:nowrap}
.eta.late{background:rgba(255,107,94,.18);color:var(--bad)}
.eta.okk{background:rgba(76,195,138,.15);color:var(--ok)}
/* Salón */
.salon{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;position:relative}
.zone .zh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.zone .zh b{font:700 20px/1 var(--fd)}
.floor{background:repeating-linear-gradient(45deg,#f4eee5 0 14px,#efe8dc 14px 28px);border-radius:12px;padding:14px;border:1px solid var(--line)}
.floor.ext{background:repeating-linear-gradient(90deg,#eef3ea 0 22px,#e7eee2 22px 44px)}
.tables{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tables.ext{grid-template-columns:repeat(3,minmax(0,1fr))}
.mesa{position:relative;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));border-radius:16px;min-height:104px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;color:var(--tx);min-width:0;transition:transform .12s}
.mesa:hover{transform:translateY(-2px)}
.mesa.round{border-radius:50%;aspect-ratio:1;min-height:0}
.mesa .mn{font:700 26px/1 'Poppins',sans-serif;color:var(--c)}
.mesa .ms{font-size:11.5px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mesa .mt3{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mesa .flag{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--acc);color:var(--accTx);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mesa .flag.l{right:auto;left:-9px;background:var(--info);color:#04172b}
.mesa.sel{outline:3px solid var(--tx);outline-offset:3px}
.m-libre{--c:#a89f93}.m-ocupada{--c:var(--acc)}.m-pend{--c:var(--info)}.m-curso{--c:var(--warn)}.m-listo{--c:var(--ok)}.m-cuenta{--c:var(--hot)}.m-qr{--c:#8fb3d9}
.barra{display:flex;flex-direction:column;gap:10px}
.counter{height:26px;border-radius:8px;background:linear-gradient(180deg,#5a3a22,#3d2616);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);display:flex;align-items:center;padding:0 12px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#e7c9a5}
.stools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stools .mesa{min-height:96px;border-radius:40px 40px 14px 14px;padding:8px 4px}
.stools .mesa .ms{font-size:10.5px}
.ord .oh .small{line-height:1.9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:16px;min-width:0}
/* Pedido (ticket) */
.ord{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ord .oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ord .oh b{font:600 18px/1.1 var(--fd);letter-spacing:.02em}
.ord ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.ord li{display:flex;gap:8px;font-size:13.5px}
.ord li .q{font:600 14px/1.3 var(--fd);color:var(--acc2);min-width:24px}
.ord li em{display:block;font-style:normal;color:var(--warn);font-size:12px}
.ord li small{display:block;color:var(--mut);font-size:12px}
.olist{display:flex;flex-direction:column;gap:10px}
/* Cocina KDS */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.kcol>h3{font:700 18px/1 var(--fd);display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}
.kt{background:var(--panel2);border:1px solid var(--line2);border-top:5px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kt.late{--c:var(--bad)!important;box-shadow:0 0 0 1px rgba(255,107,94,.4)}
.kt .kh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kt .kh b{font:700 21px/1.05 var(--fd)}
.etas{display:flex;flex-wrap:wrap;gap:6px}
.etas button{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:6px 10px;font:600 14px/1 var(--fd);min-width:46px}
.etas button:hover{border-color:var(--acc);color:var(--acc2)}
/* Productos / composer */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px;min-width:0}
.prod:hover{border-color:var(--acc)}
.prod .pi{aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:#0d0b0a;display:grid;place-items:center}
.prod .pi svg{width:100%;height:100%}
.prod b{font-size:13.5px;line-height:1.2}
.prod span{font:600 15px/1 var(--fd);color:var(--acc2)}
.cart{display:flex;flex-direction:column;gap:8px}
.cl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line2)}
.cl:last-child{border-bottom:0}
.cl .q{font:600 16px/1.2 var(--fd);color:var(--acc2);min-width:26px}
.cl .d{flex:1;min-width:0}
.cl small{display:block;color:var(--mut);font-size:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.qty button{border:0;background:none;width:34px;height:34px;font-size:18px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.ov.l2{z-index:220}
.md{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:var(--sh)}
.md.wide{width:min(980px,100%)}
.md.mid{width:min(720px,100%)}
.md-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.md-h h3{font:700 20px/1.2 var(--fd)}
.md-h small{color:var(--mut);font-size:12.5px}
.md-b{padding:16px 18px;overflow:auto}
.md-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--panel3);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none}
/* Toasts */
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 32px))}
.toast{background:#fff;border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:12px;padding:11px 14px;box-shadow:var(--sh);font-size:13.5px;animation:tin .2s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.info{border-left-color:var(--info)}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
/* Voz */
.fab{position:fixed;right:20px;bottom:20px;z-index:150;width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--accTx);display:grid;place-items:center;box-shadow:0 10px 28px rgba(255,127,0,.35)}
.fab svg{width:27px;height:27px}
.fab.rec,.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,127,0,.6)}70%{box-shadow:0 0 0 18px rgba(255,127,0,0)}100%{box-shadow:0 0 0 0 rgba(255,127,0,0)}}
.vz{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffb15e,#ff7f00 60%,#c65a00);color:#1f0d00;display:grid;place-items:center;margin:8px auto}
.mic svg{width:48px;height:48px}
.vlog{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto}
.vmsg{padding:9px 12px;border-radius:12px;font-size:13.5px;max-width:92%}
.vmsg.u{align-self:flex-end;background:var(--accS);border:1px solid rgba(255,127,0,.35)}
.vmsg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2)}
.vmsg.a.err{border-color:rgba(255,107,94,.5)}
.vmsg small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.wave{display:flex;gap:4px;justify-content:center;height:26px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--acc);height:6px}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:24px}}
/* Fermentación */
.lote{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lote .lh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.lote .lh b{font:600 19px/1 var(--fd);letter-spacing:.03em}
.fbar{position:relative;height:16px;border-radius:99px;background:var(--panel3);overflow:hidden}
.fbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.fbar em{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.65}
.spark{width:100%;height:46px;display:block}
/* Turnos */
.shift{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;min-width:46px;padding:5px 6px;font:600 13px/1 var(--fd);letter-spacing:.04em}
.shift.M{background:rgba(242,193,78,.16);border-color:rgba(242,193,78,.5);color:var(--warn)}
.shift.N{background:var(--accS);border-color:rgba(255,127,0,.5);color:var(--acc2)}
.shift.MN{background:rgba(197,140,255,.14);border-color:rgba(197,140,255,.5);color:var(--hot)}
/* Factura */
.inv{background:#fff;color:#111;border-radius:10px;padding:18px;font-size:12.5px;line-height:1.4}
.inv .ih{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;border:1px solid #111;padding:10px}
.inv .let{border:2px solid #111;display:grid;place-items:center;font:700 34px/1 Arial;height:60px}
.inv .let small{font-size:9px;display:block}
.inv table td,.inv table th{border-bottom:1px solid #ddd;padding:5px 4px;color:#111}
.inv .qr{width:96px;height:96px}
.inv .qr svg{width:100%;height:100%}
.qrbox{background:#fff;border-radius:12px;padding:10px;display:inline-block}
.qrbox svg{width:150px;height:150px;display:block}

/* =====================================================================
   VISTA CLIENTE (.cx-) · lo que ve el comensal al escanear el QR / NFC
   ===================================================================== */
.cxwrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:24px;align-items:start;padding:24px}
.phone{width:400px;height:min(820px,calc(100dvh - 48px));border-radius:44px;border:10px solid #1d1b1a;box-shadow:0 0 0 2px #3a3533,0 30px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;background:#0b0a0a}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#1d1b1a;border-radius:0 0 16px 16px;z-index:20}
.cxroot{--cb:#fff6e2;--ck:#1b130e;--ck2:#6b5a4b;--co:#ff7f00;--cl:#ead9bd;--cc:#ffffff;position:relative;height:100%;color:var(--ck);font-size:14.5px;background:var(--cb)}
.cxroot.full{min-height:100dvh;height:auto;max-width:560px;margin:0 auto;box-shadow:0 0 0 1px #2b2523}
.cx{background:var(--cb);color:var(--ck);height:100%;overflow:auto}
.cxroot.full .cx{height:auto;overflow:visible}
.cx-hero{background:#0b0a0a;color:#fff;padding:30px 18px 18px;text-align:center;position:relative;overflow:hidden}
.cx-hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:var(--cb);border-radius:22px 22px 0 0}
.cx-hero img{width:118px;height:118px;border-radius:50%}
.cx-hero p{font-size:12.5px;color:#d8c9b5;margin-top:6px}
.cx-mesa{display:inline-flex;gap:8px;align-items:center;background:var(--co);color:#1f0d00;border-radius:99px;padding:5px 14px;font:600 15px/1.2 var(--fd);letter-spacing:.05em;text-transform:uppercase;margin-top:10px}
.cx-tabs{position:sticky;top:0;z-index:10;background:var(--cb);display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--cl)}
.cx-tabs button{border:0;background:none;padding:12px 4px 10px;font-weight:600;font-size:13px;color:var(--ck2);border-bottom:3px solid transparent;position:relative}
.cx-tabs button.on{color:var(--ck);border-bottom-color:var(--co)}
.cx-tabs .b{position:absolute;top:3px;right:4%;background:var(--co);color:#1f0d00;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:700}
.cx-body{padding:14px 14px 110px}
.cx-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cx-cats button{flex:none;border:1px solid var(--cl);background:var(--cc);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--ck)}
.cx-cats button.on{background:var(--ck);color:var(--cb);border-color:var(--ck)}
.cx h4{font:800 22px/1.15 'Playfair Display',Georgia,serif;margin:16px 0 10px;display:flex;gap:10px;align-items:center}
.cx h4::after{content:"";flex:1;height:1px;background:var(--cl)}
.cx-item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:9px;margin-bottom:10px;text-align:left;width:100%;color:var(--ck)}
.cx-item .pi{width:92px;height:92px;border-radius:12px;overflow:hidden;background:#0b0a0a}
.cx-item .pi svg{width:100%;height:100%}
.cx-item b{font-size:15px;line-height:1.2;display:block}
.cx-item p{font-size:12.5px;color:var(--ck2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx-item .pr{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.cx-item .pr span{font:600 17px/1 var(--fd)}
.cx-add{background:var(--co);color:#1f0d00;border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.cx-tag{display:inline-block;background:#ffe2bd;color:#8a3d00;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px;vertical-align:middle}
.cx-cartbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:15;background:var(--ck);color:var(--cb);border:0;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.cxroot.full .cx-cartbar{position:fixed;max-width:536px;margin:0 auto}
.cx-btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--co);color:#1f0d00;width:100%;font-size:15px}
.cx-btn.sec{background:var(--cc);border:1px solid var(--cl);color:var(--ck)}
.cx-btn[disabled]{opacity:.45}
.cx-card{background:var(--cc);border:1px solid var(--cl);border-radius:16px;padding:14px;margin-bottom:12px}
.cx-card .lbl{color:var(--ck2)}
.cxroot .qty{border-color:var(--cl)}
.cxroot input,.cxroot textarea,.cxroot select{background:#fff;border-color:var(--cl);color:var(--ck)}
.cx-steps{display:flex;flex-direction:column;gap:0;margin:8px 0 4px}
.cx-step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding-bottom:12px;position:relative}
.cx-step::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--cl)}
.cx-step:last-child::before{display:none}
.cx-step i{width:26px;height:26px;border-radius:50%;border:2px solid var(--cl);background:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:var(--ck2);z-index:1}
.cx-step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.cx-step.cur i{background:var(--co);border-color:var(--co);color:#1f0d00;animation:pulse 1.4s infinite}
.cx-step b{font-size:14px}
.cx-step small{display:block;color:var(--ck2);font-size:12px}
.cx-eta{background:#0b0a0a;color:#fff;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.cx-eta b{display:block;font:600 44px/1 var(--fd);color:var(--co);font-variant-numeric:tabular-nums;margin:6px 0}
.cx-sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.cxroot.full .cx-sheet{position:fixed}
.cx-sheet>div{background:var(--cb);width:100%;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 22px}
.cxroot.full .cx-sheet>div{max-width:560px;margin:0 auto}
.cx-sheet .big{height:180px;border-radius:14px;overflow:hidden;background:#0b0a0a;margin-bottom:12px}
.cx-sheet .big svg{width:100%;height:100%}
.cx-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--cl);font-size:14px}
.cx-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.cx-seg button{border:1px solid var(--cl);background:#fff;border-radius:12px;padding:10px;font-weight:600;color:var(--ck);text-align:left;font-size:13px}
.cx-seg button.on{border-color:var(--co);box-shadow:inset 0 0 0 2px var(--co)}
.cx-foot{text-align:center;font-size:11.5px;color:var(--ck2);padding:18px 10px 4px}
.cx-toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:40;background:var(--ck);color:var(--cb);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.cxroot.full .cx-toast{position:fixed}
.cxside{display:flex;flex-direction:column;gap:14px;max-width:380px}
.cxside.r{justify-self:start}.cxside.l{justify-self:end}

/* Ajustes V26 */
.nav a{overflow:hidden;text-overflow:ellipsis}
@media (max-width:1680px){.datebox{display:none}}
.cx-item .pr span.cx-add{font:700 13px/1.2 'Poppins',sans-serif}
.cx-mesa{font:600 14px/1.2 'Poppins',sans-serif;letter-spacing:.08em}
/* Barra superior V26 · etiquetas */
.tag{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.75rem;font-weight:700;background:#eee;color:#444;white-space:nowrap}
.tag.ok{background:#e6f4ec;color:#1e7a46}.tag.warn{background:#fff4dc;color:#8a5a00}.tag.bad{background:#fdecea;color:#c0392b}
.demo-b{background:#e8e4ff;color:#3b2f9e;border-radius:99px;padding:.1rem .6rem;font-size:.72rem;font-weight:700;white-space:nowrap}
.topbar2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* Acceso del equipo (#acceso) */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(70% 60% at 30% 10%,#3a332d,#1d1b19)}
.lcard{width:min(400px,100%);background:#fff;color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;text-align:center}
.lcard img.lg{width:120px;height:120px;border-radius:50%;margin:0 auto}
.lcard h1{font:700 24px/1.2 var(--fd)}
.lcard .field{text-align:left;margin:0}
.lcard .err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.vbb img{display:block;width:100%;height:auto;border-radius:12px}
.credit{font-size:12px;color:var(--mut);line-height:1.5}
.credit b{color:var(--ink)}
/* Responsive */
@media (max-width:1240px){
  .salon{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .s3{grid-column:span 6}.s4{grid-column:span 6}.s5,.s7,.s8,.s9{grid-column:span 12}.s6{grid-column:span 12}
  .cxwrap{grid-template-columns:minmax(0,1fr) auto}
  .cxside.l{display:none}
  .vz{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1000px){
  .kds{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow button:nth-child(3){border-right:0}
  .flow button:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;width:276px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh)}
  .app.open .sb{transform:none}
  .app.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
  .burger{display:block}
  .top{padding:9px 14px}.content{padding:16px 14px 100px}
  .s3,.s4{grid-column:span 12}
  .datebox{display:none}
  .cxwrap{grid-template-columns:minmax(0,1fr);padding:12px}
  .cxside.r{display:none}
  .phone{width:100%;max-width:420px;margin:0 auto}
}
@media (max-width:640px){
  .tables{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stools{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow button{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
  .prof button span{display:none}
  .stools .mesa .ms{display:none}
  .top .ttl{min-width:0;flex-basis:calc(100% - 60px)}
  .prof button{padding:7px 9px}
  .md-b{padding:14px}
  .ov{padding:0;align-items:flex-end}
  .md{border-radius:18px 18px 0 0;max-height:94dvh}
  .phone{border:0;border-radius:0;box-shadow:none;height:calc(100dvh - 110px)}
  .phone .notch{display:none}
  .fab{right:14px;bottom:14px;width:54px;height:54px}
}
@media print{
  body{background:#fff;color:#000}
  .sb,.top,.toasts,.fab,.md-f,.x,#view>*:not(.printable){display:none!important}
  .ov{position:static;background:none;padding:0}.md{border:0;box-shadow:none;max-height:none;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function pizzaArt(spec){
  const sauce=spec.sauce===false?'#f3dfb0':'#c8381f';
  let s=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" fill="#120f0d"/>`;
  s+=`<circle cx="100" cy="104" r="86" fill="#000" opacity=".45"/><circle cx="100" cy="100" r="86" fill="#d79a52"/><circle cx="100" cy="100" r="86" fill="none" stroke="#b9732f" stroke-width="5"/>`;
  s+=scatter(26,spec.seed||3,84,(x,y,r)=>{const dx=x-100,dy=y-100,d=Math.hypot(dx,dy)||1;const k=(78+r*6)/d;return `<ellipse cx="${100+dx*k}" cy="${100+dy*k}" rx="${3+r*4}" ry="${2+r*2.5}" fill="#2a1609" opacity="${.55+r*.4}"/>`});
  s+=`<circle cx="100" cy="100" r="68" fill="${sauce}"/>`;
  if(spec.cheese!==false)s+=scatter(14,(spec.seed||3)+7,52,(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="${12+r*8}" ry="${9+r*6}" fill="#fff3d6" opacity=".95"/>`);
  (spec.tops||[]).forEach((t,i)=>{const [k,n]=t;s+=scatter(n,(spec.seed||3)*11+i*17,56,(x,y,r)=>TOP[k](x,y,r))});
  return s+'</svg>';
}

/* =====================================================================
   6. FERMENTACIÓN · bollos de masa madre disponibles
   ===================================================================== */
function lotePhase(l){
  const el=now()-l.start,tgt=l.hours*H;
  if(l.descartado)return {k:'desc',l:'Descartado',c:'bad'};
  if(l.usados>=l.bollos)return {k:'agot',l:'Agotado',c:'mut'};
  if(el<3*H)return {k:'bloque',l:'Bloque a temp. ambiente',c:'info'};
  if(el<tgt)return {k:'frio',l:'Maduración en frío',c:'warn'};
  if(el<tgt+24*H)return {k:'listo',l:'Listo para hornear',c:'ok'};
  return {k:'pasado',l:'Sobremadurado · usar ya',c:'bad'};
}
function bollosDisp(){return S.ferm.lotes.reduce((a,l)=>{const k=lotePhase(l).k;return a+((k==='listo'||k==='pasado')?Math.max(0,l.bollos-l.usados):0)},0)}
function useBollos(q,ref){
  let rest=q;const lots=S.ferm.lotes.filter(l=>['listo','pasado'].includes(lotePhase(l).k)).sort((a,b)=>a.start-b.start);
  for(const l of lots){if(rest<=0)break;const take=Math.min(rest,l.bollos-l.usados);l.usados=r1(l.usados+take);rest=r1(rest-take)}
  return rest<=0.001;
}

/* =====================================================================
   7. STOCK · descuento por ficha técnica (FEFO por lote)
   ===================================================================== */
function consumeOrder(o){
  if(o.stockDone)return true;
  const need={};let bol=0;
  o.items.forEach(it=>{const p=prod(it.pid);if(!p)return;const k=it.size==='i'?SIZES.i.k:1;
    Object.entries(p.ficha).forEach(([id,q])=>need[id]=(need[id]||0)+q*k*it.qty);
    it.extras.forEach(e=>Object.entries(extra(e).ficha).forEach(([id,q])=>need[id]=(need[id]||0)+q*it.qty));
    bol+=(p.bollo||0)*(it.size==='i'?SIZES.i.b:1)*it.qty});
  Object.entries(need).forEach(([id,q])=>{const i=insumo(id);if(!i)return;i.stock=Math.max(0,r1(i.stock-q));
    let rest=q;i.lotes.sort((a,b)=>a.venc-b.venc).forEach(lt=>{const t=Math.min(rest,lt.qty);lt.qty=r1(lt.qty-t);rest-=t});i.lotes=i.lotes.filter(lt=>lt.qty>0);
    S.movs.unshift({t:now(),ins:id,qty:-r1(q),tipo:'Consumo',ref:'Pedido #'+o.n})});
  if(S.movs.length>600)S.movs.length=600;
  const okB=bol?useBollos(bol,o.n):true;
  o.stockDone=true;o.bollos=bol;
  if(!okB)notify('Sin bollos madurados suficientes para el pedido #'+o.n+'. Revisá fermentación.',['cocina','admin'],{k:'bad'});
  return okB;
}

 dispatch(o,cad,by){ if(o.status!=='listo')return 'El pedido #'+o.n+' todavía no está listo.';
  if(o.channel==='delivery'){if(!cad)return 'Elegí un cadete.';o.cadete=cad;S.cadetes[cad].estado='en_reparto'}
  pushLog(o,'en_camino',by);notify('Pedido #'+o.n+' salió '+(cad?'con '+first(staffBy(cad).n):'con el rider de PedidosYa')+'.',['caja','admin']);audit('Despacho','#'+o.n);return null},
 deliver(o,by){ if(!['listo','en_camino'].includes(o.status))return 'El pedido #'+o.n+' no está listo para entregar.';
  if(o.cadete&&S.cadetes[o.cadete]){const c=S.cadetes[o.cadete];c.estado='disponible';c.ent++;if(!o.paid){c.efectivo+=orderTotal(o);o.paid=true;o.payNote='Cobrado por cadete'}}
  pushLog(o,'entregado',by);audit('Entregado','#'+o.n);return null},
 cancel(o,why,by){ if(['entregado','cancelado'].includes(o.status))return 'El pedido #'+o.n+' ya está cerrado.';
  pushLog(o,'cancelado',by);o.cancelWhy=why||'';notify('Pedido #'+o.n+' cancelado'+(why?': '+why:'')+'.',['mozo','caja','cocina','admin'],{k:'bad'});audit('Cancelación','#'+o.n+' · '+(why||''));return null}
};

function sessionOrders(t){if(!t.session)return [];return S.orders.filter(o=>o.tableId===t.id&&o.sessionId===t.session.id&&o.status!=='cancelado')}
function tableState(t){
  const os=sessionOrders(t),cart=(S.carts[t.id]||[]).length;
  if(t.session?.bill)return {k:'cuenta',l:'Pidió la cuenta'};
  if(os.some(o=>o.status==='listo'))return {k:'listo',l:'Listo para servir'};
  if(os.some(o=>o.status==='pend_mozo'))return {k:'pend',l:'Pedido QR sin validar'};
  if(os.some(o=>['pend_caja','pend_cocina','preparando'].includes(o.status)))return {k:'curso',l:'Pedido en curso'};
  if(t.session)return {k:'ocupada',l:'Ocupada'};

}
function tableTotal(t){return sessionOrders(t).reduce((a,o)=>a+orderTotal(o),0)}
function flowCounts(){
  const a=S.orders;const carts=Object.values(S.carts).filter(c=>c.length).length;
  return {pre:carts,mozo:a.filter(o=>o.status==='pend_mozo').length,caja:a.filter(o=>o.status==='pend_caja').length,
   cocina:a.filter(o=>o.status==='pend_cocina'||o.status==='preparando').length,ent:a.filter(o=>o.status==='listo'||o.status==='en_camino').length,
   sinTiempo:a.filter(o=>o.status==='pend_cocina').length,late:a.filter(o=>o.status==='preparando'&&o.etaAt<now()).length};

}

function cobroModal(k){

function cobroCalc(){
  const c=cuentas().find(x=>x.k===U.cobro.k);if(!c)return null;
  const sub=c.total;let desc=0,cup=null,err='';
  if(U.cobro.cupon){cup=S.club.cupones.find(x=>x.code===U.cobro.cupon.trim().toUpperCase());
    if(!cup)err='El cupón no existe.';else if(!cup.active||cup.until<now())err='El cupón está vencido o inactivo.';else if(cup.max&&cup.uses>=cup.max)err='El cupón llegó a su límite de usos.';else if(sub<cup.min)err='Compra mínima '+money(cup.min)+'.';

  const so=U.cobro.socio?S.club.socios.find(s=>s.id===U.cobro.socio):null;
  return {c,sub,desc,total:sub-desc,cup:err?null:cup,err,so,pts:so?Math.floor((sub-desc)/S.club.ppp):0};
}

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

  const pairs=[];Object.entries(ALIAS).forEach(([id,al])=>al.forEach(a=>pairs.push([id,a])));pairs.sort((a,b)=>b[1].length-a[1].length);

function vTargets(t){

function vItems(t){
  const ms=[...t.matchAll(/#(\w+)#/g)];const out=[];
  ms.forEach((m,k)=>{

    const q=Math.min(30,nums.length?+nums[nums.length-1][1]:1);
    const nextStart=k+1<ms.length?ms[k+1].index:t.length;let after=t.slice(m.index+m[0].length,nextStart);
    if(k+1<ms.length){const nn=[...after.matchAll(/\b(\d+)\b/g)];if(nn.length)after=after.slice(0,nn[nn.length-1].index)}

function vRun(raw){
  if(S.profile==='cliente')return {err:1,msg:'El asistente de voz es exclusivo del personal.'};

  }

  if(/(cancel|anul)/.test(rest)){const e=perm('cancelar');if(e)return e;const o=vFind(tg,['pend_mozo','pend_caja','pend_cocina','preparando']);if(!o)return {err:1,msg:'No encontré un pedido activo para cancelar.'};

    VOICE.interim=int||fin;$$('.vInterim').forEach(el=>el.textContent=VOICE.interim||'Escuchando…');if(fin){VOICE.interim='';voiceExec(fin)}};

function fmtQ(q,u){q=+q||0;if(u==='g')return q>=1000?r1(q/1000).toLocaleString('es-AR')+' kg':Math.round(q)+' g';if(u==='ml')return q>=1000?r1(q/1000).toLocaleString('es-AR')+' l':Math.round(q)+' ml';return (q%1?r1(q):q)+' u'}
function costU(i){return i.u==='g'?money(i.cost*1000)+'/kg':i.u==='ml'?money(i.cost*1000)+'/l':money(i.cost)+'/u'}
function spark(vals,lo,hi){if(!vals.length)return '';const W=200,Hh=46;const mn=Math.min(lo,...vals),mx=Math.max(hi,...vals);const pts=vals.map((v,i)=>[(vals.length===1?W/2:i/(vals.length-1)*W),Hh-4-(v-mn)/(mx-mn||1)*(Hh-8)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="${Hh-4-(hi-mn)/(mx-mn||1)*(Hh-8)}" width="${W}" height="${(hi-lo)/(mx-mn||1)*(Hh-8)}" fill="rgba(76,195,138,.12)"/><polyline fill="none" stroke="var(--acc2)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--acc2)"/>`).join('')}</svg>`}
function doughCalc(n,peso,h){const tot=n*peso,fl=tot/(1+h/100+.028+.2);return {fl,agua:fl*h/100,sal:fl*.028,mm:fl*.2,tot}}

  const g=S.rrhh.grid;const ROLES={admin:'Administración',mozo:'Salón',caja:'Caja',cocina:'Cocina',cadete:'Reparto'};

  return head('Personal y turnos','Grilla semanal (M = 11 a 16, producción y masas · N = 19 a 01, servicio), fichadas de entrada y salida y cobertura por sector. Tocá un casillero para cambiar el turno.')
  +`<div class="grid12"><div class="card s12"><h3>Grilla de la semana</h3><div class="tw"><table><thead><tr><th>Persona</th><th>Sector</th>${DL.map(d=>`<th style="text-align:center">${d}</th>`).join('')}<th class="num">Horas</th></tr></thead><tbody>

  </tbody><tfoot>${['mozo','cocina','caja','cadete'].map(r=>`<tr><td colspan="2" class="small">Cobertura noche · ${ROLES[r]}</td>${DK.map(d=>{const c=cov(d,r);const need={mozo:2,cocina:1,caja:1,cadete:1}[r];return `<td style="text-align:center">${d==='lun'?'<span class="tiny mut">cerrado</span>':`<span class="pill ${c>=need?'ok':'bad'}">${c}</span>`}</td>`}).join('')}<td></td></tr>`).join('')}</tfoot></table></div></div>
  <div class="card s12"><h3>Fichadas de hoy</h3><div class="tw"><table><thead><tr><th>Persona</th><th>Entrada</th><th>Salida</th><th class="num">Horas</th><th></th></tr></thead><tbody>
  ${S.staff.map(s=>{const f=S.rrhh.fich.filter(x=>x.staff===s.id).slice(-1)[0];const on=f&&!f.out;return `<tr><td><b>${esc(s.n)}</b></td><td class="mono">${f?hm(f.in):'—'}</td><td class="mono">${f?.out?hm(f.out):'—'}</td><td class="num">${f?hrs((f.out||now())-f.in):'—'}</td><td class="num">${on?'<span class="pill ok">En turno</span> ':''}<button class="btn xs ${on?'ghost':''}" data-a="fichar" data-id="${s.id}">${on?'Fichar salida':'Fichar entrada'}</button></td></tr>`}).join('')}</tbody></table></div></div></div>`;
};

 fichaSug(){const p=prod(U.fichaSel);p.price=Math.round(prodCost(p,'g')/.3/100)*100;audit('Precio actualizado',p.n+' · '+money(p.price));commit()},
 /* stock */
 stockTab(el){U.stockTab=el.dataset.v;render()},
 insInfo(el){insInfo(el.dataset.id)},
 ingreso(){ingresoModal()},
 ingresoOk(){const i=insumo($('#inI').value),q=+$('#inQ').value;if(!(q>0)){toast('Ingresá la cantidad.','bad');return}const c=+$('#inC').value;
  i.stock=r1(i.stock+q);if(c>0)i.cost=c;i.lotes.push({lote:$('#inL').value||'S/L',venc:new Date($('#inV').value+'T12:00').getTime()||now()+20*D,qty:q,ing:now(),pv:$('#inP').value});
  S.movs.unshift({t:now(),ins:i.id,qty:q,tipo:'Ingreso',ref:'Remito '+(prov($('#inP').value)?.n||'')+' · lote '+$('#inL').value});audit('Ingreso de mercadería',i.n+' · '+fmtQ(q,i.u));closeModal();commit();toast('Ingreso registrado: '+i.n,'ok')},
 pedidoProv(){pedidoProvModal()},
 newProv(){modal(mh('Nuevo proveedor')+`<div class="md-b"><div class="field"><label>Razón social</label><input id="prN" autofocus></div><div class="g2"><div class="field"><label>Rubro</label><input id="prR"></div><div class="field"><label>CUIT</label><input id="prC"></div></div><div class="g2"><div class="field"><label>Teléfono</label><input id="prT"></div><div class="field"><label>Correo</label><input id="prE"></div></div><div class="field"><label>Días de entrega</label><input id="prD"></div></div><div class="md-f"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn" data-a="provOk">Guardar</button></div>`)},
 provOk(){const n=$('#prN').value.trim();if(n.length<3){toast('Escribí la razón social.','bad');return}S.provs.push({id:uid('pv'),n,rubro:$('#prR').value,cuit:$('#prC').value,tel:$('#prT').value,email:$('#prE').value,dias:$('#prD').value});closeModal();commit()},
 /* facturación */
 invoice(el){invoiceModal(el.dataset.id)},
 print(){window.print()},
 retryArca(){S.invoices.filter(f=>f.estado==='Contingencia').forEach(f=>{f.cae=fakeCAE();f.estado='Aprobado';f.vto=now()+10*D});audit('Reintento ARCA','Contingencia autorizada');commit();toast('ARCA respondió: comprobantes autorizados','ok')},
 notaCredito(el){const f=S.invoices.find(x=>x.id===el.dataset.id);if(!confirm('¿Emitir nota de crédito C por '+money(f.total)+'?'))return;S.seq.fac++;const nc={id:uid('f'),tipo:'NC',pv:f.pv,nro:S.seq.fac,t:now(),cliente:f.cliente,items:[{d:'Anula factura C '+facNro(f),imp:f.total}],subtotal:f.total,desc:0,total:f.total,medio:f.medio,orders:[],cae:fakeCAE(),vto:now()+10*D,estado:'Aprobado'};S.invoices.push(nc);f.estado='Anulado';audit('Nota de crédito',facNro(nc));closeModal();commit();invoiceModal(nc.id)},
 /* club */
 newSocio(){socioModal()},

 newCupon(){cuponModal()},
 cuponOk(){const c=$('#cuC').value.trim().toUpperCase().replace(/\s/g,'');if(c.length<4||S.club.cupones.some(x=>x.code===c)){toast('Código inválido o repetido.','bad');return}S.club.cupones.push({code:c,desc:$('#cuDs').value||'Cupón',type:$('#cuT').value,val:+$('#cuV').value||0,min:+$('#cuM').value||0,until:now()+(+$('#cuD').value||30)*D,uses:0,max:0,active:true});closeModal();commit()},

 /* rrhh */
 shift(el){const g=S.rrhh.grid[el.dataset.id];const seq=['','M','N','MN'];g[el.dataset.d]=seq[(seq.indexOf(g[el.dataset.d]||'')+1)%4];commit()},
 fichar(el){const id=el.dataset.id;const f=S.rrhh.fich.filter(x=>x.staff===id).slice(-1)[0];if(f&&!f.out){f.out=now();audit('Fichada de salida',staffBy(id).n)}else{S.rrhh.fich.push({id:uid('f'),staff:id,in:now(),out:null});audit('Fichada de entrada',staffBy(id).n)}commit()},
 /* ajustes */
 reset(){if(!confirm('¿Restablecer todos los datos de demostración?'))return;S=seedState();applyLocal();VOICE.log=[];save();toast('Datos restablecidos','ok');render()},
 export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='diparma-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},
 autopilot(){autopilot()}
};
document.addEventListener('click',ev=>{
  const ov=ev.target.classList&&ev.target.classList.contains('ov')?ev.target:null;
  if(ov){closeModal(ov.id==='m2');return}
  const el=ev.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='cxSheetOut'&&ev.target.closest('[data-stop]')&&ev.target!==el)return;
  const f=ACT[el.dataset.a];if(!f)return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')ev.preventDefault();
  try{f(el,ev)}catch(e){console.error(e);toast('Error: '+e.message,'bad')}
});
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset.ch;if(!k)return;
  if(k==='compQ'){U.comp.q=el.value;const pos=el.selectionStart;renderCompose();const n=$('#compQ');n.focus();n.setSelectionRange(pos,pos)}
  else if(k==='compCu'){U.comp.customer[el.dataset.f]=el.value}
  else if(k==='itNote'){U.item.note=el.value}
  else if(k==='cobro'&&el.dataset.f==='cupon'){U.cobro.cupon=el.value.toUpperCase();clearTimeout(U.cupT);U.cupT=setTimeout(()=>{const pos=el.selectionStart;renderCobro();const n=$('#cupIn');if(n){n.focus();n.setSelectionRange(pos,pos)}},350)}
  else if(k==='cxWeb'){U.web[el.dataset.f]=el.value}
  else if(k==='calcN'){U.calcN=Math.max(1,Math.min(400,+el.value||1));clearTimeout(U.cT);U.cT=setTimeout(render,300)}
});
document.addEventListener('change',ev=>{
  const el=ev.target,k=el.dataset.ch;if(!k)return;
  if(k==='actor'){S.actor[S.profile]=el.value;saveLocal();render()}
  else if(k==='itEx'){const a=U.item.extras;el.checked?a.push(el.value):a.splice(a.indexOf(el.value),1);U.item.cx?renderCx():renderItem()}
  else if(k==='cobro'){const f=el.dataset.f;U.cobro[f]=el.type==='checkbox'?el.checked:el.value;if(f!=='cupon')renderCobro()}
  else if(k==='cxTable'){U.cxTable=el.value||null;U.cx.tab='carta';U.cx.sheet=null;render()}
  else if(k==='vSpeak'){VOICE.speak=el.checked}
  else if(k==='py'){S.py[el.dataset.f]=el.checked;commit()}
  else if(k==='fichaQ'){const p=prod(U.fichaSel);const v=+el.value;if(v>0)p.ficha[el.dataset.id]=v;commit()}
  else if(k==='fichaP'){const p=prod(U.fichaSel);const v=+el.value;if(v>0){p.price=Math.round(v);audit('Precio actualizado',p.n+' · '+money(p.price));commit()}}
  else if(k==='biz'){const f=el.dataset.f;S.biz[f]=['bolloPeso','hidr'].includes(f)?(+el.value||S.biz[f]):el.value;commit()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if(!$('#m2').hidden)closeModal(true);else if(!$('#m1').hidden)closeModal();else if(U.cx.sheet){U.cx.sheet=null;renderCx()}}
  if(ev.key==='Enter'&&ev.target.id==='lgP'){doLogin()}
  if(ev.key==='Enter'&&ev.target.id==='vIn'){ACT.vSend()}
  if(ev.key==='Enter'&&ev.target.id==='vIn2'){ACT.vSend2()}
  if(ev.key==='Enter'&&ev.target.id==='etaIn'){const b=$('[data-a="etaOk"]');if(b)b.click()}
});

/* =====================================================================
   22. RELOJ EN VIVO (cuentas regresivas de cocina, cliente y fermentación)
   ===================================================================== */
function tick(){
  const n=now();
  $$('[data-cd]').forEach(el=>{const t=+el.dataset.cd;el.textContent=mmss(t-n);el.classList.toggle('late',t<n)});
  $$('[data-el]').forEach(el=>{el.textContent=mmss(n-(+el.dataset.el))});
  $$('[data-cdm]').forEach(el=>{const m=Math.ceil((+el.dataset.cdm-n)/MIN);el.textContent=m>0?m+'′':'!'});
  $$('[data-ago]').forEach(el=>{el.textContent=ago(+el.dataset.ago)});
  const c=$('#clock');if(c){const d=new Date(n);c.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
}
let PYT=0;
setInterval(()=>{
  tick();
  if(S.py.demoFeed&&S.py.auto&&!U.standalone&&S.profile!=='cliente'&&now()-PYT>45000){PYT=now();simulatePY();save();render()}
},1000);

/* Sincronización entre pestañas (personal ↔ carta del cliente) */
function applyLocal(){if(LOCAL.actor)S.actor=Object.assign(S.actor,LOCAL.actor);S.profile=U.standalone?'cliente':(LOCAL.profile||'admin')}
function syncIn(){
  const prev=S.lastNotif;let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){return}if(!s)return;
  S=s;applyLocal();
  S.notifs.filter(n=>n.id>prev).reverse().forEach(showToastFor);
  const typing=document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!$('#m1').hidden;
  if(!$('#m1').hidden&&$('#m1').dataset.k==='cobro'){renderCobro();return}
  if(!typing)render();
}
if(BC)BC.onmessage=e=>{if(e.data?.from!==TAB)syncIn()};
window.addEventListener('storage',e=>{if(e.key===KEY&&!BC)syncIn()});

/* =====================================================================
   23. CIRCUITO EN AUTOMÁTICO (para la presentación)
   ===================================================================== */
let AP=null;
function autopilot(){
  if(AP){toast('El circuito automático ya está corriendo.','info');return}
  const t=S.tables.find(x=>x.id==='E3'&&!x.session)||S.tables.find(x=>!x.session&&x.sector!=='barra');
  if(!t){toast('No hay mesas libres para la demostración.','bad');return}
  U.view=S.profile==='admin'?'salon':U.view;U.salonSel=t.id;closeModal();
  let o=null;const lines=[makeLine('p_dip',1,'g',['x_bur'],'cortar en 8'),makeLine('p_marg',1,'i'),makeLine('b_cer',2)];
  const steps=[
   ()=>{S.carts[t.id]=[lines[0]];toast('1/7 · Un cliente escanea el NFC de '+t.label+' y empieza a armar el pedido (el mozo lo ve en vivo).','info')},
   ()=>{S.carts[t.id]=lines.slice();toast('2/7 · Agrega una individual y dos cervezas.','info')},
   ()=>{o=FLOW.create({tableId:t.id,channel:'qr',items:S.carts[t.id],status:'pend_mozo',by:'Cliente '+t.label,guests:3});delete S.carts[t.id];toast('3/7 · El cliente envía el pedido #'+o.n+'. Queda esperando al mozo.','info')},
   ()=>{FLOW.validate(o,'Sofía');toast('4/7 · Sofía (moza) lo valida en la mesa: pasa a caja.','info')},
   ()=>{FLOW.confirm(o,'Camila');toast('5/7 · Camila lo confirma en caja: entra a cocina.','info')},
   ()=>{FLOW.accept(o,16,'Franco');toast('6/7 · Franco (pizzaiolo) lo acepta con 16 min. El cliente ve la cuenta regresiva.','info')},
   ()=>{FLOW.ready(o,'Franco');toast('7/7 · Sale del horno: aviso al mozo y al cliente. Probá ahora cobrar la mesa desde Caja.','ok');AP=null}
  ];
  let i=0;const run=()=>{try{steps[i]()}catch(e){console.error(e);AP=null;return}save();render();i++;if(i<steps.length)AP=setTimeout(run,3200)};
  AP=1;run();
}

/* =====================================================================
   24. INICIO
   ===================================================================== */
(function init(){
  S=load();
  /* Rutas como en Sistema RAVE: "/" carta pública · "?mesa=I4" carta de la mesa (QR/NFC) · "#acceso" equipo */
  const q=new URLSearchParams(location.search);
  const m=q.get('mesa');
  if(m&&S.tables.some(t=>t.id===m)){U.standalone=true;U.cxTable=m}
  else if(location.hash!=='#acceso'){U.standalone=true;U.cxTable=null}
  applyLocal();
  U.view=HOME[S.profile]||'dashboard';
  S.notifs.forEach(n=>SEEN.add(n.id));U.seenNotif=0;
  save();render();
  if(U.standalone)document.title=(U.cxTable?table(U.cxTable).label+' · ':'')+S.biz.name+' · Carta';
  window.addEventListener('hashchange',()=>{if(new URLSearchParams(location.search).get('mesa'))return;if(location.hash==='#acceso'){if(U.standalone)goStaff()}else if(!U.standalone)goPublic()});
})();
</script>
